<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Filler</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Job Filler</h1>
      <span id="status" class="status">idle</span>
    </header>

    <section id="resume-section">
      <h2>1. 简历</h2>
      <input type="file" id="resume-file" accept=".txt,.md,.json" />
      <p class="hint">.txt / .md / .json(MVP:先支持纯文本)</p>
      <details>
        <summary>或粘贴文本</summary>
        <textarea id="resume-text" rows="6" placeholder="把简历文本贴这里..."></textarea>
        <button id="parse-resume">解析并保存</button>
      </details>
      <div id="resume-preview"></div>
    </section>

    <section id="form-section">
      <h2>2. 当前页面表单</h2>
      <button id="extract-btn">扫描本页字段</button>
      <p id="field-count" class="hint"></p>
    </section>

    <section id="plan-section">
      <h2>3. 填充计划(请 review)</h2>
      <button id="plan-btn">生成填充计划</button>
      <div id="plan-list"></div>
      <button id="apply-btn" disabled>应用填充(不提交)</button>
    </section>

    <p id="err" class="err"></p>

    <script src="sidepanel.js"></script>
  </body>
</html>
