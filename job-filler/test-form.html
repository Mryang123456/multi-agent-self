<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Job Filler Test Form</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto">
  <h1>Mock Job Application</h1>
  <form id="app" onsubmit="return false">
    <p><label>Full Name <input type="text" name="name" id="name"></label></p>
    <p><label>Email <input type="text" name="email" id="email"></label></p>
    <p><label>Phone <input type="text" name="phone" id="phone"></label></p>
    <p><label>LinkedIn <input type="text" name="linkedin" id="linkedin"></label></p>
    <p><label>Location <input type="text" name="location" id="location"></label></p>
    <p><label>Skills <input type="text" name="skills" id="skills"></label></p>
    <p><label>Country
      <select name="country" id="country">
        <option value="">-- select --</option>
        <option value="us">United States</option>
        <option value="cn">China</option>
        <option value="other">Other</option>
      </select>
    </label></p>
    <p><label><input type="checkbox" name="consent" id="consent"> I agree to the terms</label></p>
    <p><label>Why this job? <textarea name="why" id="why" rows="3"></textarea></label></p>
    <p><label>Years of experience
      <input type="radio" name="exp" value="0-2"> 0-2
      <input type="radio" name="exp" value="3-5"> 3-5
      <input type="radio" name="exp" value="6+"> 6+
    </label></p>
    <button type="submit">Submit (manual)</button>
  </form>
  <p id="dump"></p>
</body>
</html>
